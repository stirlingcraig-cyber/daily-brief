name: Daily Brief

on:
  schedule:
    - cron: "17 6 * * *"     # every day 06:17 UTC (06:17 UK winter / 07:17 UK summer)
  workflow_dispatch:          # "Run workflow" button - also works from the GitHub iPhone app
  push:
    branches: [main]
    paths: ["daily_brief.py", "config.json", "tests/**"]

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build brief
        run: |
          python daily_brief.py \
            --home "$RUNNER_TEMP/home" \
            --output-dir docs \
            --history docs/history.json \
            --no-update-check

      - name: Publish to GitHub Pages (docs folder)
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Daily brief $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase --autostash
            git push
          fi
